<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QR → Transactions (mobile)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>QR → Transactions</h1>
    <p class="subtitle">Importe images/PDF → extrait transactions → PDF</p>
  </header>

  <main class="container">

    <section class="panel">
      <label class="field-label">Importer des images ou PDF (factures)</label>
      <input id="fileInput" type="file" accept="image/*,application/pdf" multiple>
      <div class="row gap-sm">
        <button id="processBtn" class="btn primary">Scanner & Traiter</button>
        <button id="clearBtn" class="btn">Réinitialiser</button>
      </div>
    </section>

    <section class="panel">
      <label class="field-label">Montant à soustraire</label>
      <input id="subtractInput" type="number" step="0.01" placeholder="0.00" class="input-small">
      <div class="row gap-sm">
        <button id="previewPdfBtn" class="btn">Aperçu PDF</button>
        <button id="downloadPdfBtn" class="btn primary">Générer PDF</button>
      </div>
    </section>

    <section class="panel small">
      <div id="status">Statut: prêt</div>
      <div id="counts">Transactions uniques: 0 — Total: 0,00 $</div>
    </section>

    <section class="panel results-panel">
      <h2 class="section-title">Transactions</h2>
      <div id="resultsList" class="list"></div>
    </section>

    <section class="panel">
      <h2 class="section-title">Aperçu PDF</h2>
      <div id="pdf-content" style="height:400px; overflow:auto;"></div>
    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
